      name: '没有明显的自恋倾向',
      characteristics: '本次回答没有显示某一种特质明显突出。希望被肯定、争取空间或偶尔在意评价都是常见的人类体验，需结合持续性和对生活的影响理解。',
      factors: '没有突出倾向不需要寻找病因。自我评价会随压力、关系和生活阶段变化，本问卷也不能解释个人经历。',
      attraction: '没有证据表明某一类人会特别被你吸引；通常由共同兴趣、价值观、沟通方式和现实环境共同影响。',
      boundaries: '任何人都可能遇到欺骗或控制。若有人持续施压、孤立你、限制资源或不尊重拒绝，优先联系可信任的人并寻求专业支持。',
      advice: {
        '恋爱': '保持坦诚沟通与相互尊重；遇到持续困扰时及时讨论，而不是只凭一次测试判断关系。',
        '工作': '明确目标与边界，定期检查压力和需求，必要时寻求同事或主管支持。',
        '交友': '维持互相支持，也允许彼此有不同的兴趣、节奏和社交边界。',
        '家庭': '用具体、尊重的方式表达期待；长期冲突可考虑家庭沟通或专业协助。'
      }
    };

    const questionIndexEl = document.getElementById('questionIndex');
    const questionTextEl = document.getElementById('questionText');
    const optionsEl = document.getElementById('options');
    const prevBtn = document.getElementById('prevBtn');
    const resultBox = document.getElementById('resultBox');
    const profileListEl = document.getElementById('profileList');
    const introScreen = document.getElementById('introScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const restartBtn = document.getElementById('restartBtn');

    Object.values(profiles).forEach(profile => {
      const item = document.createElement('li');
      item.className = 'profile-preview';

      const heading = document.createElement('h3');
      heading.textContent = profile.name;
      const description = document.createElement('p');
      description.textContent = profile.preview;

      item.append(heading, description);
      profileListEl.appendChild(item);
    });

    document.getElementById('startBtn').addEventListener('click', () => {
      introScreen.hidden = true;
      quizScreen.hidden = false;
      renderQuestion();
    });

    let currentIndex = 0;
    let selectedAnswers = [];
    let isAdvancing = false;

    function renderQuestion() {
      const currentQuestion = questions[currentIndex];
      questionIndexEl.textContent = `第 ${currentIndex + 1} / ${questions.length} 题`;
      questionTextEl.textContent = currentQuestion.text;
      optionsEl.innerHTML = '';
      prevBtn.disabled = currentIndex === 0 || isAdvancing;

      currentQuestion.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.type = 'button';
        btn.textContent = option;

        if (selectedAnswers[currentIndex] === index) {
          btn.classList.add('selected');
        }

        btn.addEventListener('click', () => {
          if (isAdvancing) return;

          selectedAnswers[currentIndex] = index;
          btn.classList.add('selected');
          isAdvancing = true;
          prevBtn.disabled = true;

          setTimeout(() => {
            if (currentIndex < questions.length - 1) {
              currentIndex += 1;
              isAdvancing = false;
              renderQuestion();
            } else {
              isAdvancing = false;
              showResult();
            }
          }, 180);
        });

        optionsEl.appendChild(btn);
      });
    }

    function showResult() {
      const dimensionScores = Object.fromEntries(
        Object.keys(profiles).map(dimension => {
          const questionIndexes = questions
            .map((question, index) => question.dimension === dimension ? index : -1)
            .filter(index => index !== -1);
          const total = questionIndexes.reduce((sum, index) => sum + selectedAnswers[index], 0);
          return [dimension, total / questionIndexes.length];
        })
      );
      const [dominantDimension, dominantScore] = Object.entries(dimensionScores)
        .reduce((leader, candidate) => candidate[1] > leader[1] ? candidate : leader);
      const profile = dominantScore < 1.25
        ? noClearTendencyProfile
        : profiles[dominantDimension];
      const ratingIndex = Math.min(4, Math.floor(dominantScore / 3 * 5));
      const stars = '★'.repeat(ratingIndex + 1) + '☆'.repeat(4 - ratingIndex);
      const ratingNames = ['很低', '偏低', '中等', '偏高', '较高'];
      const levelDescriptions = [
        '这类反应在本次回答中较少出现。',
        '这类反应偶尔出现，通常不占主导。',
        '这类反应在部分情境中会出现，可以留意触发它的关系或压力。',
        '这类反应出现较频繁，可能值得观察它对关系、工作或情绪的影响。',
        '这类反应在多个情境中较常出现；若已造成困扰，可考虑和心理健康专业人士进一步讨论。'
      ];

      resultBox.replaceChildren();

      const heading = document.createElement('h2');
      heading.textContent = `你的特质画像：${profile.name}`;
      const score = document.createElement('p');
      score.className = 'result-score';
      score.textContent = `倾向评分：${stars}（${ratingIndex + 1}/5，${ratingNames[ratingIndex]}）`;
      const level = document.createElement('p');
      level.className = 'result-level';
      level.textContent = levelDescriptions[ratingIndex];
      resultBox.append(heading, score, level);

      const resultSections = [
        ['主要特征', `${profile.characteristics} ${levelDescriptions[ratingIndex]}`],
        ['可能的形成因素', profile.factors],
        ['可能吸引或靠近你的人', profile.attraction],
        ['易受影响的情境与自我保护', profile.boundaries]
      ];

      resultSections.forEach(([title, text]) => {
        const section = document.createElement('section');
        section.className = 'result-section';
        const sectionHeading = document.createElement('h3');
        sectionHeading.textContent = title;
        const paragraph = document.createElement('p');
        paragraph.textContent = text;
        section.append(sectionHeading, paragraph);
        resultBox.appendChild(section);
      });

      const adviceSection = document.createElement('section');
      adviceSection.className = 'result-section';
      const adviceHeading = document.createElement('h3');
      adviceHeading.textContent = '不同生活场景的小建议';
      const adviceList = document.createElement('ul');
      adviceList.className = 'result-advice';
      Object.entries(profile.advice).forEach(([area, suggestion]) => {
        const item = document.createElement('li');
        const areaLabel = document.createElement('strong');
        areaLabel.textContent = `${area}：`;
        item.append(areaLabel, document.createTextNode(suggestion));
        adviceList.appendChild(item);
      });
      adviceSection.append(adviceHeading, adviceList);
      resultBox.appendChild(adviceSection);

      const caveat = document.createElement('small');
      caveat.className = 'result-caveat';
      caveat.textContent = '星级仅表示本问卷中得分最高维度的自我报告倾向，不代表临床严重程度；本测试不是经验证的诊断工具，也不能诊断NPD。若相关困扰持续影响生活或关系，请咨询心理健康专业人士。';
      resultBox.appendChild(caveat);
      resultBox.classList.add('show');
      quizScreen.hidden = true;
      resultScreen.hidden = false;
    }

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0 && !isAdvancing) {
        currentIndex -= 1;
        renderQuestion();
      }
    });

    restartBtn.addEventListener('click', () => {
      currentIndex = 0;
      selectedAnswers = [];
      isAdvancing = false;

      resultScreen.hidden = true;
      introScreen.hidden = true;
      quizScreen.hidden = false;

      renderQuestion();
    });

  </script>
</body>
</html>
